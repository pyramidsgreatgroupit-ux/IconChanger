name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Extract project ZIP
        run: |
          unzip -q IconChanger_Android_GitHub_Actions.zip -d extracted
          echo "Extracted files:"
          find extracted -maxdepth 3 -type f | head -50

      - name: Install Gradle
        run: |
          wget -q https://services.gradle.org/distributions/gradle-8.9-bin.zip
          unzip -q gradle-8.9-bin.zip -d $HOME/gradle
          echo "$HOME/gradle/gradle-8.9/bin" >> $GITHUB_PATH

      - name: Build APK
        run: |
          cd extracted/IconChanger
          gradle assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: IconChanger-APK
          path: extracted/IconChanger/app/build/outputs/apk/debug/app-debug.apk
